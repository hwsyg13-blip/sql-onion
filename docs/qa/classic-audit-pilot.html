<style>
  :root {
    --bg: #0f1419;
    --fg: #e6e6e6;
    --muted: #8b9296;
    --border: #2a3138;
    --card-bg: #161b22;
    --hl: #4a9eff;
    --hl-bg: rgba(74, 158, 255, 0.12);
    --table-header: #1f2630;
    --table-row-alt: rgba(255, 255, 255, 0.02);
    --code-bg: #0d1117;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; margin: 0; background: var(--bg); color: var(--fg); }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 10; }
  header h1 { margin: 0 0 4px; font-size: 18px; }
  header .meta { color: var(--muted); font-size: 13px; }
  .pager { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 12px 24px; border-bottom: 1px solid var(--border); background: var(--card-bg); }
  .pager button { background: transparent; color: var(--fg); border: 1px solid var(--border); padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; min-width: 32px; }
  .pager button:hover:not(:disabled) { background: var(--hl-bg); border-color: var(--hl); }
  .pager button:disabled { opacity: 0.4; cursor: not-allowed; }
  .pager button.current { background: var(--hl); color: #fff; border-color: var(--hl); }
  .pager .info { margin-left: auto; color: var(--muted); font-size: 13px; }
  .pager .nav { display: flex; gap: 4px; }
  main { padding: 24px; max-width: 1400px; margin: 0 auto; }
  .entry { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 24px; overflow: hidden; background: var(--card-bg); }
  .entry-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--table-header); }
  .entry-header .key { font-weight: 600; color: var(--hl); font-family: monospace; font-size: 14px; }
  .entry-header .batch { background: var(--hl-bg); color: var(--hl); padding: 2px 8px; border-radius: 4px; font-size: 12px; font-family: monospace; }
  .entry-header .hash { color: var(--muted); font-family: monospace; font-size: 12px; }
  .entry-header .name { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  @media (max-width: 900px) { .entry-body { grid-template-columns: 1fr; } }
  .col { padding: 16px; }
  .col + .col { border-left: 1px solid var(--border); }
  @media (max-width: 900px) { .col + .col { border-left: none; border-top: 1px solid var(--border); } }
  .col h3 { margin: 0 0 12px; font-size: 13px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
  .col img { max-width: 100%; height: auto; border: 1px solid var(--border); border-radius: 4px; image-rendering: pixelated; }
  .ref { margin-bottom: 16px; }
  .ref:last-child { margin-bottom: 0; }
  .ref-caption { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-family: monospace; }
  table.ref-table { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.ref-table th, table.ref-table td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  table.ref-table th { background: var(--table-header); color: var(--fg); font-weight: 600; font-size: 12px; }
  table.ref-table tr:nth-child(even) td { background: var(--table-row-alt); }
  table.ref-table td:empty::after { content: "(빈)"; color: var(--muted); font-style: italic; font-size: 11px; }
  pre.ref-sql { background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: 10px; font-size: 12px; overflow-x: auto; margin: 0; color: #d4d4d4; }
  .ref-text { font-size: 13px; line-height: 1.5; padding: 8px; background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; }
  .ref-image-info { font-size: 12px; color: var(--muted); padding: 8px; background: var(--code-bg); border: 1px dashed var(--border); border-radius: 4px; }
  .ref-image-info strong { color: var(--fg); }
  .ref-unknown { font-size: 12px; color: #d97706; }
</style>

:"j45","refs":[{"type":"sql","caption":"[CREATE]","code":"CREATE TABLE T\n(C INTEGER PRIMARY KEY,\n D INTEGER);\n\nCREATE TABLE S\n(B INTEGER PRIMARY KEY,\n C INTEGER REFERENCES T(C) ON DELETE CASCADE);\n\nCREATE TABLE R\n(A INTEGER PRIMARY KEY,\n B INTEGER REFERENCES S(B) ON DELETE SET NULL);"},{"type":"table","caption":"현재 테이블 T","headers":["C","D"],"rows":[["1","1"],["2","2"]]},{"type":"table","caption":"현재 테이블 S","headers":["B","C"],"rows":[["1","1"],["2","2"]]},{"type":"table","caption":"현재 테이블 R","headers":["A","B"],"rows":[["1","1"],["2","2"]]}]},{"batch":2,"hash":"e6f5bcb75338","name":"j48 — 학생 테이블 생성 + COUNT(*) vs COUNT(학번)","imageKey":"j48","refs":[{"type":"sql","caption":"생성)","code":"create table 학생 (학번 char(8) primary key,\n               장학금 integer);"},{"type":"sql","caption":"SQL1·SQL2","code":"SQL1: select count(*) from 학생\nSQL2: select count(학번) from 학생"}]},{"batch":2,"hash":"526874a1f0b8","name":"j53 — CREATE TABLE TBL + 5개 INSERT","imageKey":"j53","refs":[{"type":"sql","caption":"[SQL]","code":"CREATE TABLE TBL\n(\n  ID NUMBER PRIMARY KEY,\n  AMT NUMBER NOT NULL,\n  DEGREE VARCHAR2(1)\n);\n\n1. INSERT INTO TBL VALUES(1, 100)\n2. INSERT INTO TBL(ID, AMT, DEGREE) VALUES(2, 200, 'AB')\n3. INSERT INTO TBL(ID, DEGREE) VALUES(4, 'X')\n4. INSERT INTO TBL(ID, AMT) VALUES(3, 300)\n5. INSERT INTO TBL VALUES(5, 500, NULL)"}]},{"batch":2,"hash":"21899d3ee230","name":"j54 — BOARD 엔터티 속성 박스","imageKey":"j54","refs":[{"type":"image","src":"/sqld-images/j54-1.png","alt":"BOARD 엔터티 속성 (BOARD_ID, BOARD_NM, USE_YN, REG_DATE, BOARD_DESC)","caption":"[BOARD]"}]},{"batch":2,"hash":"a8f873d150fe","name":"j55 — 고객·주문 ERD + 주문데이터·고객데이터 + ALTER FK","imageKey":"j55","refs":[{"type":"image","src":"/sqld-images/j55-1.png","alt":"고객-주문 ERD (FK_001)","caption":"[ERD]"},{"type":"table","caption":"[표 : 주문 데이터]","headers":["주문번호(PK)","고객ID(FK)","주문일시"],"rows":[["0001","C001","2013-12-24"],["0002","C001","2013-12-25"],["0003","NULL","2013-12-26"],["0004","C002","2013-12-27"]]},{"type":"table","caption":"[표 : 고객 데이터]","headers":["고객ID(PK)","고객명","가입일시"],"rows":[["C001","홍길동","2013-12-12"],["C002","이순신","2013-12-13"]]},{"type":"sql","caption":"[SQL]","code":"ALTER TABLE 주문 ADD CONSTRAINT FK_001 FOREIGN KEY (고객ID)\nREFERENCES 고객 (고객ID) ON DELETE SET NULL;"}]},{"batch":2,"hash":"4b08a029e606","name":"j61 — 테이블 A + UPDATE/CREATE/ROLLBACK","imageKey":"j61","refs":[{"type":"table","caption":"[테이블 : A]","headers":["ID(PK)","VAL"],"rows":[["001","100"],["002","200"]]},{"type":"sql","caption":"[SQL]","code":"UPDATE A SET VAL = 200 WHERE ID = '001';\nCREATE TABLE B ( ID CHAR(3) PRIMARY KEY);\nROLLBACK;"}]},{"batch":2,"hash":"b1d5335494b2","name":"j62 — 품목 테이블 + 트랜잭션 SQL","imageKey":"j62","refs":[{"type":"table","caption":"[품목]","headers":["품목ID","단가"],"rows":[["001","1000"],["002","2000"],["003","1000"],["004","2000"]]},{"type":"sql","caption":"[SQL구문]","code":"BEGIN TRANSACTION\nINSERT INTO 품목(품목ID, 단가)\n  VALUES('005', 2000)\nCOMMIT\nBEGIN TRANSACTION\nDELETE 품목 WHERE 품목ID='002'\nUPDATE 품목 SET 단가=2000 WHERE 단가=1000\nROLLBACK\nSELECT COUNT(품목ID) FROM 품목\n  WHERE 단가=2000"}]},{"batch":3,"hash":"d12b4d9e7222","name":"j63 — EMP_TBL + WHERE 복합조건","imageKey":"j63","refs":[{"type":"table","caption":"EMP_TBL","headers":["EMPNO","SAL"],"rows":[["100","1500"],["200","3000"],["300","2000"]]},{"type":"sql","caption":"[SQL]","code":"SELECT COUNT(*)\nFROM   EMP_TBL\nWHERE  EMPNO > 100 AND SAL >= 3000 OR EMPNO = 200;"}]},{"batch":3,"hash":"bbfc48a5ead4","name":"j64 — TAB_A (NULL 다수, 3건)","imageKey":"j64","refs":[{"type":"table","caption":"TAB_A (레코드 3건)","headers":["COL1","COL2","COL3"],"rows":[["30","NULL","20"],["NULL","10","40"],["50","NULL","NULL"]]}]},{"batch":3,"hash":"b8703b1e1499","name":"j67 — 월별매출 10행","imageKey":"j67","refs":[{"type":"table","caption":"[테이블 : 월별매출]","headers":["년(PK)","월(PK)","매출금액"],"rows":[["2014","01","1000"],["2014","02","2000"],["2014","03","3000"],["2014","11","4000"],["2014","12","5000"],["2015","01","6000"],["2015","02","7000"],["2015","03","8000"],["2015","11","9000"],["2015","12","10000"]]}]},{"batch":3,"hash":"6154460ee14c","name":"j68 — 서비스_가입 (논리) ↔ SVC_JOIN (물리)","imageKey":"j68","refs":[{"type":"image","src":"/sqld-images/j68-1.png","alt":"서비스_가입 논리 모델 ↔ SVC_JOIN 물리 모델","caption":"[논리 ↔ 물리 데이터 모델]"}]},{"batch":3,"hash":"63298c5c1e50","name":"j73 — TAB1 (5행, NULL/공백 혼재)","imageKey":"j73","refs":[{"type":"table","caption":"[TAB1]","headers":["COL1","COL2"],"rows":[["a","NULL"],["b","''"],["c","3"],["d","4"],["e","3"]]}]},{"batch":3,"hash":"7fd4a22eb49d","name":"j74 — EMP_Q + SAL/COMM 산술","imageKey":"j74","refs":[{"type":"sql","caption":"[SQL]","code":"SELECT SAL/COMM FROM EMP_Q WHERE ENAME = 'KING';\nSELECT SAL/COMM FROM EMP_Q WHERE ENAME = 'FORD';\nSELECT SAL/COMM FROM EMP_Q WHERE ENAME = 'SCOTT';\n\n-- 단, SCOTT의 COMM은 NULL 값임"},{"type":"table","caption":"EMP_Q","headers":["ENAME (문자타입)","SAL (숫자타입)","COMM (숫자타입)"],"rows":[["KING","0","300"],["FORD","5000","0"],["SCOTT","1000",""]]}]},{"batch":3,"hash":"86ea4aa66496","name":"j75 — TAB1 (sparse) + SUM(COALESCE)","imageKey":"j75","refs":[{"type":"table","caption":"TAB1","headers":["C1","C2","C3"],"rows":[["1","2","3"],["","2","3"],["","","3"]]},{"type":"sql","caption":"[SQL]","code":"SELECT SUM(COALESCE(C1, C2, C3))\nFROM   TAB1"}]},{"batch":3,"hash":"9f38c32d8879","name":"j76 — TAB_A + 3 AVG(COL3) SQL","imageKey":"j76","refs":[{"type":"sql","caption":"[SQL]","code":"SELECT AVG(COL3) FROM TAB_A;\nSELECT AVG(COL3) FROM TAB_A WHERE COL1 > 0;\nSELECT AVG(COL3) FROM TAB_A WHERE COL1 IS NOT NULL;"},{"type":"table","caption":"[TAB_A]","headers":["COL1","COL2","COL3"],"rows":[["30","NULL","20"],["NULL","40","0"],["0","10","NULL"]]}]},{"batch":3,"hash":"c3adb82d126a","name":"j77 — 3 SQL on EMP (COUNT/IN/GROUP BY)","imageKey":"j77","refs":[{"type":"sql","caption":"SQL1","code":"SELECT COUNT(GRADE) FROM EMP;"},{"type":"sql","caption":"SQL2","code":"SELECT GRADE FROM EMP WHERE GRADE IN ('차장', '부장', '널');"},{"type":"sql","caption":"SQL3","code":"SELECT GRADE, COUNT(*) FROM EMP GROUP BY GRADE;"}]},{"batch":3,"hash":"e3437bbf19f6","name":"j81 — TBL(ID 단일컬럼 7행) + GROUP BY/HAVING","imageKey":"j81","refs":[{"type":"table","caption":"TBL","headers":["ID"],"rows":[["100"],["100"],["200"],["200"],["200"],["999"],["999"]]},{"type":"sql","caption":"[SQL]","code":"SELECT ID FROM TBL\nGROUP BY ID\nHAVING COUNT(*) = 2\nORDER BY (CASE WHEN ID = 999 THEN 0 ELSE ID END)"}]},{"batch":3,"hash":"427a9bfdd20d","name":"j84 — TBL(ID/AMT 4행) + ORDER BY CASE","imageKey":"j84","refs":[{"type":"table","caption":"TBL","headers":["ID","AMT"],"rows":[["A","50"],["A","200"],["B","300"],["C","100"]]},{"type":"sql","caption":"[SQL]","code":"SELECT ID, AMT\nFROM   TBL\nORDER BY (CASE WHEN ID = 'A' THEN 1 ELSE 2 END),\n         AMT DESC"}]},{"batch":3,"hash":"25534ce1f380","name":"j87 — 배우/영화/출연 스키마 정의","imageKey":"j87","refs":[{"type":"image","src":"/sqld-images/j87-1.png","alt":"배우(배우번호, 배우명, 성별), 영화(영화번호, 영화명, 제작년도), 출연(배우번호, 영화번호, 출연료) 스키마","caption":"[스키마 정의]"}]},{"batch":3,"hash":"051f5a3742e6","name":"j89 — EMP_TBL + RULE_TBL + LIKE 조인","imageKey":"j89","refs":[{"type":"table","caption":"[EMP_TBL]","headers":["EMPNO","ENAME"],"rows":[["1000","SMITH"],["1050","ALLEN"],["1100","SCOTT"]]},{"type":"table","caption":"[RULE_TBL]","headers":["RULE_NO","RULE"],"rows":[["1","S%"],["2","%T%"]]},{"type":"sql","caption":"[SQL]","code":"SELECT COUNT(*) CNT\nFROM   EMP_TBL A, RULE_TBL B\nWHERE  A.ENAME LIKE B.RULE"}]},{"batch":3,"hash":"fd161ca39ef6","name":"j91 — 제품·생산제품·생산라인 ERD (M:N)","imageKey":"j91","refs":[{"type":"image","src":"/sqld-images/j91-1.png","alt":"제품-생산제품-생산라인 ERD","caption":"[ERD]"}]},{"batch":1,"hash":"170dbd920f77","name":"j95 — OS·단말기·고객 + JOIN SQL","imageKey":"j95","refs":[{"type":"table","caption":"[테이블 : OS]","headers":["OSID(PK)","OS명"],"rows":[["100","Android"],["200","iOS"],["300","Bada"]]},{"type":"table","caption":"[테이블 : 단말기]","headers":["단말기ID(PK)","단말기명","OSID(FK)"],"rows":[["1000","A1000","100"],["2000","B2000","100"],["3000","C3000","200"],["4000","D3000","300"]]},{"type":"table","caption":"[테이블 : 고객]","headers":["고객번호(PK)","고객명","단말기ID(FK)"],"rows":[["11000","홍길동","1000"],["12000","강감찬","NULL"],["13000","이순신","NULL"],["14000","안중근","3000"],["15000","고길동","4000"],["16000","이대로","4000"]]},{"type":"sql","caption":"[SQL]","code":"SELECT A.고객번호, A.고객명, B.단말기ID, B.단말기명, C.OSID, C.OS명\nFROM   고객 A LEFT OUTER JOIN 단말기 B\nON     (A.고객번호 IN (11000, 12000) AND A.단말기ID = B.단말기ID) LEFT OUTER JOIN OS C\nON     (B.OSID = C.OSID)\nORDER BY A.고객번호;"}]},{"batch":3,"hash":"f38d5a9c49cd","name":"j97 — EMP·DEPT 테이블 (조인 키 C)","imageKey":"j97","refs":[{"type":"table","caption":"EMP 테이블","headers":["A","B","C"],"rows":[["1","b","w"],["3","d","w"],["5","y","y"]]},{"type":"table","caption":"DEPT 테이블","headers":["C","D","E"],"rows":[["w","1","10"],["z","4","11"],["v","2","22"]]}]},{"batch":4,"hash":"f3a8b97ebde0","name":"j98 — TAB1·TAB2 + LEFT OUTER JOIN ON BETWEEN","imageKey":"j98","refs":[{"type":"table","caption":"TAB1","headers":["C1","C2"],"rows":[["A","1"],["B","2"],["C","3"],["D","4"],["E","5"]]},{"type":"table","caption":"TAB2","headers":["C1","C2"],"rows":[["B","2"],["C","3"],["D","4"]]},{"type":"sql","caption":"[SQL]","code":"SELECT *\nFROM TAB1 A LEFT OUTER JOIN TAB2 B\n  ON ( A.C1 = B.C1 AND B.C2 BETWEEN 1 AND 3)"}]},{"batch":1,"hash":"b9bc917bc0ea","name":"j101 — 서비스·서비스이용·회원 ERD + SQL","imageKey":"j101","refs":[{"type":"image","src":"/sqld-images/j101-erd.png","alt":"ERD","caption":"ERD"},{"type":"sql","caption":"[수행 SQL]","code":"SELECT A.서비스ID, A.서비스명, B.서비스URL\nFROM   (SELECT 서비스ID\n        FROM   서비스\n        INTERSECT\n        SELECT 서비스ID\n        FROM   서비스이용) A, 서비스 B\nWHERE  A.서비스ID = B.서비스ID;"}]},{"batch":1,"hash":"9f0eb76cef2f","name":"j104 — TBL1·TBL2 + UNION ALL/UNION SQL","imageKey":"j104","refs":[{"type":"table","caption":"[테이블 : TBL1]","headers":["COL1","COL2"],"rows":[["AA","A1"],["AB","A2"]]},{"type":"table","caption":"[테이블 : TBL2]","headers":["COL1","COL2"],"rows":[["AA","A1"],["AB","A2"],["AC","A3"],["AD","A4"]]},{"type":"sql","caption":"[SQL]","code":"SELECT COL1, COL2, COUNT(*) AS CNT\nFROM   (SELECT COL1, COL2\n        FROM   TBL1\n        UNION ALL\n        SELECT COL1, COL2\n        FROM   TBL2\n        UNION\n        SELECT COL1, COL2\n        FROM   TBL1)\nGROUP BY COL1, COL2;"}]},{"batch":1,"hash":"abc4b5af2a70","name":"j105 — T1·T2 + UNION/UNION ALL 비교","imageKey":"j105","refs":[{"type":"table","caption":"T1(A, B, C)","headers":["A","B","C"],"rows":[["A3","B2","C3"],["A1","B1","C1"],["A2","B1","C2"]]},{"type":"table","caption":"T2(A, B, C)","headers":["A","B","C"],"rows":[["A1","B1","C1"],["A3","B2","C3"]]},{"type":"sql","caption":"가.","code":"SELECT A, B, C FROM R1\nUNION ALL\nSELECT A, B, C FROM R2"},{"type":"sql","caption":"나.","code":"SELECT A, B, C FROM R1\nUNION\nSELECT A, B, C FROM R2"}]},{"batch":1,"hash":"3cffc1d77e91","name":"j107 — 회원기본정보 ─ 회원상세정보 (1:1)","imageKey":"j107","refs":[{"type":"image","src":"/sqld-images/j107-erd.png","alt":"회원기본정보 ─ 회원상세정보 ERD","caption":"[데이터 모델]"}]},{"batch":1,"hash":"e184bec88023","name":"j109 — 사원 + CONNECT BY 계층형 SQL","imageKey":"j109","refs":[{"type":"table","caption":"[테이블 : 사원]","headers":["사원번호(PK)","사원명","입사일자","매니저사원번호(FK)"],"rows":[["001","홍길동","2012-01-01","NULL"],["002","강감찬","2012-01-01","001"],["003","이순신","2013-01-01","001"],["004","이민정","2013-01-01","001"],["005","이병헌","2013-01-01","NULL"],["006","안성기","2014-01-01","005"],["007","이수근","2014-01-01","005"],["008","김병만","2014-01-01","005"]]},{"type":"sql","caption":"[SQL]","code":"SELECT 사원번호, 사원명, 입사일자, 매니저사원번호\nFROM   사원\nSTART WITH 매니저사원번호 IS NULL\nCONNECT BY PRIOR 사원번호 = 매니저사원번호\nAND 입사일자 BETWEEN '2013-01-01' AND '2013-12-31'\nORDER SIBLINGS BY 사원번호;"}]},{"batch":1,"hash":"ef87d3ec3a5d","name":"j112 — 일자별매출 + 결과 누적매출액","imageKey":"j112","refs":[{"type":"table","caption":"[테이블 : 일자별매출]","headers":["일자","매출액"],"rows":[["2015.11.01","1000"],["2015.11.02","1000"],["2015.11.03","1000"],["2015.11.04","1000"],["2015.11. "NULL","NULL","1400"]]}]},{"batch":1,"hash":"cfea6c0426c4","name":"j128 — 자재발주 + GROUPING SQL + 결과","imageKey":"j128","refs":[{"type":"table","caption":"[테이블 : 자재발주]","headers":["자재번호","발주처ID","발주일자","발주수량"],"rows":[["1","001","20150102","100"],["1","001","20150103","200"],["2","001","20150102","200"],["2","002","20150102","100"],["3","001","20150103","100"],["3","002","20150103","200"]]},{"type":"sql","caption":"[SQL]","code":"SELECT CASE WHEN GROUPING(자재번호) = 1 THEN '자재전체'\n            ELSE 자재번호 END AS 자재번호\n      ,CASE WHEN GROUPING(발주처ID) = 1 THEN '발주처전체'\n            ELSE 발주처ID END AS 발주처ID\n      ,CASE WHEN GROUPING(발주일자) = 1 THEN '발주일자전체'\n            ELSE 발주일자 END AS 발주일자\n      ,SUM(발주수량) AS 발주수량합계\nFROM   자재발주\n(ㄱ)\nORDER BY 자재번호, 발주처ID, 발주일자;"},{"type":"table","caption":"[결과]","headers":["자재번호","발주처ID","발주일자","발주수량합계"],"rows":[["1","발주처전체","발주일자전체","300"],["2","발주처전체","발주일자전체","300"],["3","발주처전체","발주일자전체","300"],["자재전체","001","20150102","300"],["자재전체","001","20150103","300"],["자재전체","002","20150102","100"],["자재전체","002","20150103","200"]]}]},{"batch":4,"hash":"b319f06b5d10","name":"j129 — 월별매출 + GROUPING SETS","imageKey":"j129","refs":[{"type":"table","caption":"[테이블 : 월별매출]","headers":["상품ID","월","매출액"],"rows":[["P001","2014.10","1500"],["P001","2014.11","1500"],["P001","2014.12","2500"],["P002","2014.10","1000"],["P002","2014.11","2000"],["P002","2014.12","1500"],["P003","2014.10","2000"],["P003","2014.11","1000"],["P003","2014.12","1000"]]},{"type":"sql","caption":"[SQL]","code":"SELECT 상품ID, 월, SUM(매출액) AS 매출액\nFROM   월별매출\nWHERE  월 BETWEEN '2014.10' AND '2014.12'\nGROUP BY GROUPING SETS((상품ID, 월));"}]},{"batch":1,"hash":"a3393d53e4dd","name":"j131 — 고객·월별매출 + RANK SQL","imageKey":"j131","refs":[{"type":"table","caption":"[테이블 : 고객]","headers":["고객번호(PK)","고객명"],"rows":[["001","홍길동"],["002","이순신"],["003","강감찬"],["004","이상화"],["005","이규혁"]]},{"type":"table","caption":"[테이블 : 월별매출]","headers":["월(PK)","고객번호(PK)","매출액"],"rows":[["201301","001","200"],["201301","002","300"],["201301","003","250"],["201301","004","300"],["201301","005","250"],["201302","001","150"],["201302","002","150"],["201302","004","200"],["201302","005","100"],["201303","002","100"],["201303","003","100"],["201303","004","200"],["201303","005","350"]]},{"type":"sql","caption":"[SQL]","code":"SELECT 고객번호, 고객명, 매출액\n      ,RANK() OVER(ORDER BY 매출액 DESC) AS 순위\nFROM   (\n        SELECT A.고객번호\n              ,MAX(A.고객명) AS 고객명\n              ,SUM(B.매출액) AS 매출액\n        FROM   고객 A INNER JOIN 월별매출 B\n        ON     (A.고객번호 = B.고객번호)\n        GROUP BY A.고객번호\n       )\nORDER BY RNK;"}]},{"batch":4,"hash":"f0e9b9de802a","name":"j132 — 게임상품·고객활동·고객 ERD + 결과 예제","imageKey":"j132","refs":[{"type":"image","src":"/sqld-images/j132-1.png","alt":"게임상품-고객활동-고객 ERD + 결과 예제 (활동점수/등수)","caption":"[ERD + 결과 예제]"}]},{"batch":4,"hash":"989b4b2e6801","name":"j133 — 추천내역 + ROW_NUMBER PARTITION","imageKey":"j133","refs":[{"type":"table","caption":"[테이블 : 추천내역]","headers":["추천경로","추천인","피추천인","추천점수"],"rows":[["SNS","나한일","강감찬","75"],["SNS","이순신","강감찬","80"],["이벤트응모","홍길동","강감찬","88"],["이벤트응모","저절로","이순신","78"],["홈페이지","저절로","이대로","93"],["홈페이지","홍두깨","심청이","98"]]},{"type":"sql","caption":"[SQL]","code":"SELECT 추천경로, 추천인, 피추천인, 추천점수\nFROM   (SELECT 추천경로, 추천인, 피추천인, 추천점수\n              ,ROW_NUMBER() OVER(PARTITION BY 추천경로\n                                 ORDER BY 추천점수 DESC) AS RNUM\n        FROM   추천내역)\nWHERE  RNUM = 1;"}]},{"batch":4,"hash":"53d0bd6a0e0f","name":"j191 — DEPT 실제 데이터 + SUM(NVL) GROUP BY","imageKey":"j191","refs":[{"type":"table","caption":"가. 실제 데이터","headers":["DEPTNO","SAL"],"rows":[["10",""],["10","1000"],["10","2000"],["20",""],["20","500"]]},{"type":"sql","caption":"나. SELECT문","code":"SELECT DEPTNO, SUM(NVL(SAL,0)) FROM DEPT GROUP BY DEPTNO;"}]},{"batch":4,"hash":"4e7d3559784c","name":"j196 — SQLD_64 의류 계층 + CONNECT BY (빈칸 SQL)","imageKey":"j196","refs":[{"type":"table","caption":"[SQLD_64]","headers":["남성의류","여성의류","의류번호"],"rows":[["아웃솔더","양말","1" const PAGE_SIZE = 10;
const TOTAL_PAGES = Math.ceil(ENTRIES.length / PAGE_SIZE);
let currentPage = 1;

function pngPath(imageKey) {
  const file = /-\d+$/.test(imageKey) ? imageKey + ".png" : imageKey + "-1.png";
  return "../../public/sqld-images/" + file;
}

function renderRef(ref) {
  const cap = ref.caption ? '<div class="ref-caption">' + escapeHtml(ref.caption) + '</div>' : '';
  if (ref.type === 'table') {
    let html = cap + '<table class="ref-table"><thead><tr>';
    for (const h of ref.headers) html += '<th>' + escapeHtml(h) + '</th>';
    html += '</tr></thead><tbody>';
    for (const row of ref.rows) {
      html += '<tr>';
      for (const cell of row) html += '<td>' + escapeHtml(cell) + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table>';
    return '<div class="ref">' + html + '</div>';
  }
  if (ref.type === 'sql') {
    return '<div class="ref">' + cap + '<pre class="ref-sql">' + escapeHtml(ref.code) + '</pre></div>';
  }
  if (ref.type === 'text') {
    return '<div class="ref">' + cap + '<div class="ref-text">' + escapeHtml(ref.text || '') + '</div></div>';
  }
  if (ref.type === 'image') {
    return '<div class="ref">' + cap + '<div class="ref-image-info"><strong>image ref:</strong> src=<code>' + escapeHtml(ref.src) + '</code><br><strong>alt:</strong> ' + escapeHtml(ref.alt || '') + '</div></div>';
  }
  if (ref.type === 'erd') {
    return '<div class="ref">' + cap + '<pre class="ref-sql">' + escapeHtml(ref.mermaid || '') + '</pre></div>';
  }
  return '<div class="ref"><span class="ref-unknown">unknown ref type: ' + ref.type + '</span></div>';
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderPage(page) {
  currentPage = page;
  const start = (page - 1) * PAGE_SIZE;
  const slice = ENTRIES.slice(start, start + PAGE_SIZE);
  const main = document.getElementById('content');
  let html = '';
  for (const e of slice) {
    const refsHtml = (e.refs || []).map(renderRef).join('');
    html += '<div class="entry">' +
      '<div class="entry-header">' +
        '<span class="key">' + escapeHtml(e.imageKey) + '</span>' +
        '<span class="batch">batch-' + e.batch + '</span>' +
        '<span class="hash">' + escapeHtml(e.hash) + '</span>' +
        '<span class="name">' + escapeHtml(e.name || '') + '</span>' +
      '</div>' +
      '<div class="entry-body">' +
        '<div class="col"><h3>BEFORE (원본 PNG)</h3>' +
          '<img src="' + pngPath(e.imageKey) + '" alt="' + escapeHtml(e.imageKey) + '">' +
        '</div>' +
        '<div class="col"><h3>AFTER (변환 ref)</h3>' + refsHtml + '</div>' +
      '</div>' +
    '</div>';
  }
  main.innerHTML = html;
  renderPager();
  window.scrollTo(0, 0);
  history.replaceState(null, '', '#page=' + page);
}

function renderPager() {
  const total = TOTAL_PAGES;
  const cur = currentPage;
  const start = (cur - 1) * PAGE_SIZE + 1;
  const end = Math.min(cur * PAGE_SIZE, ENTRIES.length);

  let pageBtns = '';
  // 이전/다음 + 페이지 번호. 최대 9개 번호 표시 (앞/뒤 4개 + 현재).
  const range = [];
  if (total <= 11) {
    for (let i = 1; i <= total; i++) range.push(i);
  } else {
    range.push(1);
    if (cur > 4) range.push('...');
    for (let i = Math.max(2, cur - 2); i <= Math.min(total - 1, cur + 2); i++) range.push(i);
    if (cur < total - 3) range.push('...');
    range.push(total);
  }
  for (const p of range) {
    if (p === '...') pageBtns += '<span style="padding: 0 4px; color: var(--muted);">…</span>';
    else pageBtns += '<button data-page="' + p + '"' + (p === cur ? ' class="current"' : '') + '>' + p + '</button>';
  }

  const pagerHtml =
    '<div class="nav">' +
      '<button data-page="1"' + (cur === 1 ? ' disabled' : '') + '>« 처음</button>' +
      '<button data-page="' + (cur - 1) + '"' + (cur === 1 ? ' disabled' : '') + '>‹ 이전</button>' +
    '</div>' +
    pageBtns +
    '<div class="nav">' +
      '<button data-page="' + (cur + 1) + '"' + (cur === total ? ' disabled' : '') + '>다음 ›</button>' +
      '<button data-page="' + total + '"' + (cur === total ? ' disabled' : '') + '>마지막 »</button>' +
    '</div>' +
    '<div class="info">' + start + '–' + end + ' / ' + ENTRIES.length + ' (페이지 ' + cur + '/' + total + ')</div>';

  document.getElementById('pager-top').innerHTML = pagerHtml;
  document.getElementById('pager-bottom').innerHTML = pagerHtml;

  for (const btn of document.querySelectorAll('.pager button[data-page]')) {
    btn.addEventListener('click', () => {
      const p = parseInt(btn.dataset.page, 10);
      if (!isNaN(p) && p >= 1 && p <= total) renderPage(p);
    });
  }
}

// 초기 페이지 (URL hash 지원)
const hashMatch = location.hash.match(/page=(\d+)/);
const initPage = hashMatch ? Math.max(1, Math.min(TOTAL_PAGES, parseInt(hashMatch[1], 10))) : 1;
renderPage(initPage);
</script>
