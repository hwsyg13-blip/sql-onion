    <noscript>
      <header>
        <h1>SQLD양파 — SQLD 3주 합격 루틴</h1>
        <p>SQLD(SQL 개발자) 자격증 단기 합격을 위한 무료 학습 사이트입니다. 회원가입 없이 즉시 이용할 수 있습니다.</p>
      </header>

      <section>
        <h2>제공 콘텐츠</h2>
        <ul>
          <li><strong>기출문제 복원 800문항</strong> — 제45회부터 제60회까지 16개 회차 SQLD 기출문제·정답·해설 전체 수록</li>
          <li><strong>전 범위 이론 정리</strong> — 1과목 데이터 모델링의 이해 / 2과목 SQL 기본 및 활용 핵심 챕터별 요약</li>
          <li><strong>실전 CBT 모의고사</strong> — 한국데이터산업진흥원(KDATA) 시험 환경과 동일한 50문항·90분 풀이 화면</li>
          <li><strong>3주 학습 계획표</strong> — 일자별 학습 분량과 진도 추적, 오답노트 자동 생성</li>
          <li><strong>랜덤 무한 퀴즈</strong> — 출퇴근 짬 학습용 무한 카드 풀이 모드</li>
        </ul>
      </section>

      <section>
        <h2>다루는 주요 주제</h2>
        <h3>1과목 — 데이터 모델링의 이해</h3>
        <p>엔터티, 속성, 관계, 주식별자, 외래식별자, 인조식별자, 정규화(1·2·3·BCNF), 반정규화, ERD(바커·IE 표기법), 식별자 관계, 비식별자 관계, 슈퍼·서브타입, 데이터베이스 스키마(외부·개념·내부)</p>

        <h3>2과목 — SQL 기본 및 활용</h3>
        <p>SELECT/INSERT/UPDATE/DELETE/MERGE, JOIN(INNER·OUTER·NATURAL·CROSS·SELF), 서브쿼리(단일행·다중행·다중컬럼·상관·인라인뷰), 그룹함수(GROUP BY·HAVING·ROLLUP·CUBE·GROUPING SETS), 윈도우함수(RANK·DENSE_RANK·ROW_NUMBER·LAG·LEAD·NTILE·누적합), 계층형 질의(START WITH·CONNECT BY·PRIOR·LEVEL), 정규표현식(REGEXP_LIKE·REGEXP_SUBSTR), 집합연산자(UNION·INTERSECT·MINUS), NULL 처리(NVL·COALESCE·NULLIF), 트랜잭션(COMMIT·ROLLBACK·SAVEPOINT), 권한 제어(DCL·GRANT·REVOKE), 제약조건(PK·FK·UNIQUE·CHECK·NOT NULL), TOP-N 쿼리(ROWNUM·OFFSET·FETCH), PIVOT/UNPIVOT, ANSI SQL 표준</p>
      </section>

      <section>
        <h2>회차별 기출문제</h2>
        <p>제45회(2022.05) · 제46회(2022.09) · 제47회(2022.11) · 제48회(2023.03) · 제49회(2023.06) · 제50회(2023.09) · 제51회(2023.11) · 제52회(2024.03) · 제53회(2024.05) · 제54회(2024.08) · 제55회(2024.11) · 제56회(2025.03) · 제57회(2025.05) · 제58회(2025.08) · 제59회(2025.11) · 제60회(2026.03)</p>
      </section>

      <section>
        <h2>SQLD 자격증 안내</h2>
        <p>SQLD(SQL Developer)는 한국데이터산업진흥원(KDATA)이 시행하는 국가공인 데이터 자격검정으로, SQL 개발자에게 필요한 데이터 모델링과 SQL 활용 능력을 검정합니다. 시험은 50문항·90분이며 60점 이상이면 합격합니다. 정보처리기사·ADsP·SQLP와 함께 데이터 직무에서 가장 많이 취득하는 자격증입니다.</p>
      </section>
